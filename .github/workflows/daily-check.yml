name: iPad Fiyat Kontrolü

on:
  schedule:
    # Her gün UTC 07:00 = Türkiye 10:00 (UTC+3)
    - cron: '0 7 * * *'
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  check-prices:
    runs-on: ubuntu-latest
  
    steps:
    - name: Kodu indir
      uses: actions/checkout@v3
  
    - name: Python kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
  
    - name: Gerekli paketleri kur
      run: |
        pip install requests beautifulsoup4
  
    - name: Script'i çalıştır
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      run: python ipad_takip.py
